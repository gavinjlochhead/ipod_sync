{% extends "base.html" %}
{% block title %}Sync Logs — iPod Sync{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="fw-bold mb-0">Sync Logs</h4>
  <button class="btn btn-sm btn-outline-secondary" onclick="loadLogs()">
    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
  </button>
</div>

<div class="card">
  <div class="card-body p-0">
    <table class="table mb-0">
      <thead>
        <tr>
          <th>Started</th>
          <th>Finished</th>
          <th>Status</th>
          <th>Music +/-</th>
          <th>Podcasts +/-</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody id="log-tbody">
        <tr><td colspan="6" class="text-center text-muted py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString([], {
    month:'short', day:'numeric',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}

function fmtDuration(s, e) {
  if (!s || !e) return '—';
  const ms = new Date(e) - new Date(s);
  if (ms < 1000) return `${ms}ms`;
  if (ms < 60000) return `${(ms/1000).toFixed(1)}s`;
  return `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
}

function statusBadge(s) {
  const m = {
    success: 'bg-success',
    error: 'bg-danger',
    running: 'bg-warning text-dark',
    cancelled: 'bg-secondary'
  };
  return `<span class="badge ${m[s]||'bg-secondary'}">${s}</span>`;
}

async function loadLogs() {
  try {
    const logs = await apiFetch('/logs?limit=50');
    const tbody = document.getElementById('log-tbody');
    if (!logs.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No sync history yet</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(l => `
      <tr>
        <td><small>${fmtDate(l.started_at)}</small></td>
        <td>
          <small>${fmtDate(l.finished_at)}</small>
          ${l.finished_at ? `<br><small class="text-muted">(${fmtDuration(l.started_at, l.finished_at)})</small>` : ''}
        </td>
        <td>${statusBadge(l.status)}</td>
        <td>
          <span class="text-success">+${l.music_added}</span>
          / <span class="text-danger">-${l.music_removed}</span>
        </td>
        <td>
          <span class="text-success">+${l.podcasts_added}</span>
          / <span class="text-danger">-${l.podcasts_removed}</span>
        </td>
        <td><small class="text-muted">${l.message||''}</small></td>
      </tr>`).join('');
  } catch(e) {
    document.getElementById('log-tbody').innerHTML =
      '<tr><td colspan="6" class="text-center text-danger py-4">Failed to load logs</td></tr>';
  }
}

loadLogs();
setInterval(loadLogs, 10000);
</script>
{% endblock %}
