<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}iPod Sync{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #0f0f0f; color: #e0e0e0; }
    .navbar { background: #1a1a1a !important; border-bottom: 1px solid #2a2a2a; }
    .navbar-brand { color: #fff !important; font-weight: 700; letter-spacing: 0.5px; }
    .nav-link { color: #aaa !important; }
    .nav-link.active, .nav-link:hover { color: #fff !important; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; }
    .card-header { background: #222; border-bottom: 1px solid #2a2a2a; }
    .table { color: #e0e0e0; }
    .table thead th { color: #aaa; border-color: #2a2a2a; }
    .table td, .table th { border-color: #2a2a2a; }
    .badge-source-rss { background-color: #e5631d; }
    .badge-source-pinepods { background-color: #5b6af0; }
    .modal-content { background: #1e1e1e; color: #e0e0e0; border: 1px solid #333; }
    .modal-header { border-bottom: 1px solid #333; }
    .modal-footer { border-top: 1px solid #333; }
    .form-control, .form-select { background: #111; color: #e0e0e0; border-color: #333; }
    .form-control:focus, .form-select:focus {
      background: #111; color: #fff; border-color: #555; box-shadow: none;
    }
    .form-control::placeholder { color: #555; }
    .form-label { color: #bbb; }
    .input-group-text { background: #222; color: #aaa; border-color: #333; }
    .stat-card .display-6 { font-size: 2rem; font-weight: 700; color: #fff; }
    .stat-card .card-title { font-size: 0.8rem; text-transform: uppercase;
                              letter-spacing: 1px; color: #888; }
    #sync-banner { display:none; position:fixed; top:56px; left:0; right:0;
                   z-index:1030; text-align:center; padding:8px;
                   background: #1b3a6b; border-bottom: 1px solid #2a5298; }
    .log-success { color: #4caf50; }
    .log-error { color: #f44336; }
    .log-running { color: #ff9800; }
    .alert-dark-info { background: #1b3a6b33; border-color: #2a5298; color: #90b8f8; }
    a { color: #7eb3f5; }
    a:hover { color: #aad0ff; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/">
      <i class="bi bi-music-note-beamed me-2"></i>iPod Sync
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
            <i class="bi bi-house me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/podcasts' in request.url.path %}active{% endif %}" href="/podcasts">
            <i class="bi bi-broadcast me-1"></i>Podcasts
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/settings' in request.url.path %}active{% endif %}" href="/settings">
            <i class="bi bi-gear me-1"></i>Settings
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/logs' in request.url.path %}active{% endif %}" href="/logs">
            <i class="bi bi-journal-text me-1"></i>Logs
          </a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        <span id="ipod-indicator" class="badge bg-secondary">
          <i class="bi bi-usb-symbol me-1"></i>Not detected
        </span>
        <button class="btn btn-sm btn-outline-warning" id="btn-eject" onclick="ejectIPod()" style="display:none">
          <i class="bi bi-eject me-1"></i>Eject
        </button>
        <button class="btn btn-sm btn-primary" id="btn-sync-now" onclick="startSync()">
          <i class="bi bi-arrow-repeat me-1"></i>Sync Now
        </button>
      </div>
    </div>
  </div>
</nav>

<div id="sync-banner">
  <i class="bi bi-arrow-repeat spin me-2"></i>
  <span id="sync-banner-msg">Syncing…</span>
</div>

<div class="container-fluid px-4 py-4">
  {% block content %}{% endblock %}
</div>

<style>
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function apiFetch(path, opts = {}) {
  const r = await fetch('/api' + path, {
    headers: {'Content-Type': 'application/json', ...opts.headers},
    ...opts
  });
  return r.json();
}

async function startSync() {
  const btn = document.getElementById('btn-sync-now');
  btn.disabled = true;
  const res = await apiFetch('/sync/start', {method: 'POST'});
  if (!res.ok) {
    alert(res.message);
    btn.disabled = false;
  }
}

async function pollSyncStatus() {
  try {
    const s = await apiFetch('/sync/status');
    const banner = document.getElementById('sync-banner');
    const msg = document.getElementById('sync-banner-msg');
    const btn = document.getElementById('btn-sync-now');
    if (s.running) {
      banner.style.display = 'block';
      msg.textContent = s.message;
      btn.disabled = true;
    } else {
      banner.style.display = 'none';
      btn.disabled = false;
    }
  } catch(e) {}
}

async function checkIPod() {
  try {
    const r = await apiFetch('/test/ipod');
    const el = document.getElementById('ipod-indicator');
    const ejectBtn = document.getElementById('btn-eject');
    if (r.ok) {
      el.className = 'badge bg-success';
      el.innerHTML = `<i class="bi bi-usb-symbol me-1"></i>${r.free_gb}GB free`;
      if (ejectBtn) ejectBtn.style.display = '';
    } else {
      el.className = 'badge bg-secondary';
      el.innerHTML = `<i class="bi bi-usb-symbol me-1"></i>Not detected`;
      if (ejectBtn) ejectBtn.style.display = 'none';
    }
  } catch(e) {}
}

async function ejectIPod() {
  const btn = document.getElementById('btn-eject');
  if (!confirm('Safely eject the iPod?\n\nMake sure no sync is running.')) return;
  btn.disabled = true;
  try {
    const r = await apiFetch('/eject', {method: 'POST'});
    if (r.ok) {
      alert(r.message);
    } else {
      alert('Eject failed: ' + (r.detail || r.message || 'Unknown error'));
    }
  } catch(e) {
    alert('Eject request failed');
  }
  btn.disabled = false;
  checkIPod();
}

pollSyncStatus();
checkIPod();
setInterval(pollSyncStatus, 3000);
setInterval(checkIPod, 10000);
</script>

{% block scripts %}{% endblock %}
</body>
</html>
